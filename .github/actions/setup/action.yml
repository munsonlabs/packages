name: Setup
description: Install the toolchain, and optionally the extras individual jobs need.

inputs:
  nuxt:
    description: >
      Generate the .nuxt type scaffolding. Needed by anything that loads the
      docs config — `vp run -r build` and the docs deploy do, `check` and `test` do not.
    default: 'false'
  playwright:
    description: Playwright browser(s) to download for the browser tests (e.g. `chromium`, `webkit`), or `false`.
    default: 'false'

runs:
  using: composite
  steps:
    - uses: voidzero-dev/setup-vp@v1.19.0
      with:
        node-version-file: .node-version
        cache: true

    # setup-vp caches npm downloads, not vp's task cache; without this every job rebuilds every package.
    - uses: actions/cache@v6
      with:
        path: node_modules/.vite/task-cache
        key: vp-task-${{ runner.os }}-${{ github.sha }}
        restore-keys: vp-task-${{ runner.os }}-

    # .npmrc sets ignore-scripts, so Nuxt's postinstall never runs.
    - if: inputs.nuxt == 'true'
      run: vp exec nuxt prepare
      shell: bash
      working-directory: docs

    - if: inputs.playwright != 'false'
      run: vp exec playwright install --with-deps ${{ inputs.playwright }}
      shell: bash

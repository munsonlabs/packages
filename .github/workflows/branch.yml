name: Branch

on:
  # main goes through Release, the Version Packages branch only through its pull request, and idea/ branches not at all.
  push:
    branches-ignore: [main, changeset-release/**, idea/**]

jobs:
  # Same CI definition as every other branch; its build job also uploads the dist that `beta` publishes.
  verify:
    uses: ./.github/workflows/ci.yml
    with:
      upload-dist: true

  # Previews wait for CI, so a docs preview or pkg.pr.new build always comes from a commit that passed.
  docs-preview:
    needs: verify
    uses: ./.github/workflows/docs.yml
    with:
      branch: ${{ github.ref_name }}
    secrets: inherit

  packages-preview:
    needs: verify
    uses: ./.github/workflows/packages-preview.yml

  # Pending changesets on beta publish under the `beta` dist-tag; the version bump is never committed,
  # so the changesets stay put and drive the real release once beta merges into main.
  beta:
    if: github.ref == 'refs/heads/beta'
    needs: verify
    runs-on: ubuntu-latest
    concurrency:
      group: beta-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          nuxt: 'false'
      # .npmrc sets ignore-scripts, so publish uses the build `verify` produced.
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: packages
      - run: vp exec changeset version --snapshot beta
      - name: Publish
        run: |
          if git diff --quiet -- 'packages/*/package.json'; then
            echo "No pending changesets, nothing to publish."
            exit 0
          fi
          npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"
          vp exec changeset publish --tag beta --no-git-tag
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

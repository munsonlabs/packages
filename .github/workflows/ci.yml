name: CI

on:
  # main runs through Release (which calls this workflow) and the Version Packages branch through pull_request.
  push:
    branches-ignore: [main, changeset-release/**]
  pull_request:
  workflow_call:
    inputs:
      upload-dist:
        description: Upload packages/*/dist for the caller's later jobs to consume.
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: vp run -r build
      - if: inputs.upload-dist
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: packages/*/dist
          retention-days: 1

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          nuxt: 'false'
      - run: vp run -r check

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          nuxt: 'false'
          playwright: chromium
      - run: vp run -r test -- --browser.name=chromium

  # Linux WebKit has no H.264/AAC decoders, so the Safari-engine run needs macOS; main only, which release goes through.
  test-webkit:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          nuxt: 'false'
          playwright: webkit
      - run: vp run -r test -- --browser.name=webkit

name: CI

on:
  # Pushes run this through Release (main) or Branch (everything else), pull requests through Pull request.
  # The build job always uploads packages/*/dist for the caller's later jobs to publish.
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          nuxt: 'true'
      - run: vp run -r build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: packages/*/dist
          retention-days: 1

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: vp run -r check

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          playwright: chromium
      - run: vp run -r test -- --browser.name=chromium

  # Linux WebKit has no H.264/AAC decoders, so the Safari-engine run needs macOS; main only, which release goes through.
  test-webkit:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          playwright: webkit
      - run: vp run -r test -- --browser.name=webkit

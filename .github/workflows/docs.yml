name: Deploy docs

on:
  # CI deploys branch previews, Release deploys production after a publish; dispatch redeploys by hand.
  workflow_call:
    inputs:
      branch:
        description: Cloudflare Pages branch to deploy to; `main` is production.
        type: string
        required: true
  workflow_dispatch:
    inputs:
      branch:
        description: Cloudflare Pages branch to deploy to; `main` is production.
        type: string
        default: main

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: docs-${{ inputs.branch }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - uses: ./.github/actions/build-site
        with:
          site-url: ${{ vars.DOCS_URL }}

      - name: Deploy to Cloudflare Pages
        run: npx --yes wrangler@4 pages deploy docs/.output/public --project-name="$PROJECT" --branch="$BRANCH"
        env:
          PROJECT: ${{ vars.CLOUDFLARE_PROJECT_NAME }}
          BRANCH: ${{ inputs.branch }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

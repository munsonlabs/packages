name: Packages preview

on:
  # Branch calls this after every green push, Pull request once a pull request opens; both after CI uploads the dist.
  workflow_call:

jobs:
  # Publishes the dist CI built and tested rather than building again. Every package goes out on every
  # run, but only the packages the branch changed get their StackBlitz examples attached.
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          nuxt: 'false'
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: packages
      - run: node .github/scripts/publish-previews.mjs

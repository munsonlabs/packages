name: Deploy to GitHub Pages

on:
  # Deploys happen post-release (changeset) or on demand
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - uses: actions/configure-pages@v6
        id: pages

      - name: Build demos
        run: |
          for dir in apps/demos/*/; do
            name=$(node -p "require('./$dir/package.json').name")
            var="VITE_BASE_$(printf '%s' "$name" | sed 's|^@||; s|[/.-]|_|g' | tr '[:lower:]' '[:upper:]')"
            export "$var=/$REPO/demo/$(basename "$dir")/"
            echo "$var=/$REPO/demo/$(basename "$dir")/"
          done
          vp run --filter './apps/demos/*' build
        env:
          REPO: ${{ github.event.repository.name }}

      - name: Generate docs
        run: vp run --filter docs generate
        env:
          NUXT_APP_BASE_URL: /${{ github.event.repository.name }}/
          NUXT_SITE_URL: ${{ steps.pages.outputs.base_url }}

      - name: Assemble site
        run: |
          for dir in apps/demos/*/; do
            target="docs/.output/public/demo/$(basename "$dir")"
            mkdir -p "$(dirname "$target")"
            cp -r "$dir/dist" "$target"
            echo "published $target"
          done
          # Jekyll would drop Nuxt's _nuxt/ and _payload.json.
          touch docs/.output/public/.nojekyll

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/.output/public
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

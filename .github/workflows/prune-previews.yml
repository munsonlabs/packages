name: Prune previews

on:
  # GitHub only runs `delete` workflows from the default branch, so this takes effect once it is on main.
  delete:

permissions:
  contents: read

jobs:
  docs:
    if: github.event.ref_type == 'branch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The runner's own Node is enough: the script needs only fetch, and no dependencies.
      - run: node .github/scripts/prune-previews.mjs
        env:
          PROJECT: ${{ vars.CLOUDFLARE_PROJECT_NAME }}
          BRANCH: ${{ github.event.ref }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

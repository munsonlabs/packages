name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  actions: write # to dispatch the Pages workflow after a publish

# Two runs racing on main could both try to publish.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Same CI definition as every other branch; its build job also uploads the dist that `release` publishes.
  verify:
    uses: ./.github/workflows/ci.yml
    with:
      upload-dist: true

  # Changesets flow: pending changesets open or refresh the Version Packages PR; merging it publishes.
  release:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: voidzero-dev/setup-vp@v1.19.0
        with:
          node-version-file: .node-version
          cache: true

      # .npmrc sets ignore-scripts, so publish uses the build `verify` produced.
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: packages

      - uses: changesets/action@v1
        id: changesets
        with:
          title: 'chore(release): version packages'
          commit: 'chore(release): version packages'
          # Run without a shell, so the lockfile refresh lives in the npm script; without it the PR fails `npm ci`.
          version: npm run version-packages
          publish: npx changeset publish
        env:
          GITHUB_TOKEN: ${{ secrets.CHANGESETS_TOKEN || secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # The docs load the published bundle, so the site rebuilds after the packages land on npm.
      - if: steps.changesets.outputs.published == 'true'
        name: Redeploy the docs site
        run: gh workflow run pages.yml --ref "$GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ github.token }}

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 310" width="800" height="310" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title">
  <title id="title">A widget in loom: designers own the JSON, app developers own the kit, loom renders the two together</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#71717a"/></marker>
  </defs>
  <rect fill="#ffffff" stroke="#e4e4e7" width="800" height="310" rx="12"/>
  <rect fill="#f4f4f5" stroke="#d4d4d8" stroke-width="1" x="20" y="20" width="240" height="130" rx="10"/>
  <text fill="#7c3aed" font-size="11" font-weight="600" letter-spacing="0.5" x="34" y="40">DESIGNERS AND EDITORS</text>
  <text fill="#18181b" font-size="14" font-weight="600" x="34" y="60">A definition (JSON)</text>
  <text fill="#52525b" font-size="12" x="34" y="80">Layout, text, colours, variants</text>
  <text fill="#52525b" font-size="12" x="34" y="97">Edited in Loom Studio</text>
  <text fill="#52525b" font-size="12" x="34" y="114">Published as library.json</text>
  <rect fill="#f4f4f5" stroke="#d4d4d8" stroke-width="1" x="280" y="20" width="240" height="130" rx="10"/>
  <text fill="#7c3aed" font-size="11" font-weight="600" letter-spacing="0.5" x="294" y="40">APP DEVELOPERS</text>
  <text fill="#18181b" font-size="14" font-weight="600" x="294" y="60">A kit</text>
  <text fill="#52525b" font-size="12" x="294" y="80">Sources: your composables</text>
  <text fill="#52525b" font-size="12" x="294" y="97">Blocks, themes, a guard</text>
  <text fill="#52525b" font-size="12" x="294" y="114">Context: the app (the bridge)</text>
  <rect fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5" x="540" y="20" width="240" height="130" rx="10"/>
  <text fill="#7c3aed" font-size="11" font-weight="600" letter-spacing="0.5" x="554" y="40">LOOM</text>
  <text fill="#18181b" font-size="14" font-weight="600" x="554" y="60">&lt;Widget&gt;</text>
  <text fill="#52525b" font-size="12" x="554" y="80">Blocks and bindings</text>
  <text fill="#52525b" font-size="12" x="554" y="97">Variants and themes</text>
  <text fill="#52525b" font-size="12" x="554" y="114">Checks definitions</text>
  <path stroke="#71717a" stroke-width="1.5" fill="none" d="M140 150 C140 200, 330 190, 370 228" marker-end="url(#a)"/>
  <path stroke="#71717a" stroke-width="1.5" fill="none" d="M400 150L400 228" marker-end="url(#a)"/>
  <path stroke="#71717a" stroke-width="1.5" fill="none" d="M660 150 C660 200, 470 190, 430 228" marker-end="url(#a)"/>
  <rect fill="#fff7ed" stroke="#fb923c" stroke-width="1" x="240" y="230" width="320" height="60" rx="10"/>
  <text fill="#18181b" font-size="14" font-weight="600" x="254" y="252">A card on screen</text>
  <text fill="#52525b" font-size="12" x="254" y="272">Looks as designed, does what the kit allows</text>
